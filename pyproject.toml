[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qtraffic"
version = "0.1.0"
description = "Queue-based fluid traffic simulation for signal-control experiments"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3,<3",
    "networkx>=3.6.1,<4",
]

[project.optional-dependencies]
ai = ["openai>=1.40,<3"]  # Featherless explanation layer (optional; the project runs without it)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
